<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جنگ بزرگ: ایران و آمریکا</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>جنگ بزرگ: ایران و آمریکا</h1>
    </header>
    <main>
        <div id="game-board">
            <!-- Game board will be generated by JavaScript -->
        </div>
        <div id="game-info">
            <p>وضعیت بازی:</p>
            <p id="turn-info">نوبت بازیکن...</p>
            <p id="selected-unit-info">واحد انتخاب شده: -</p>
            <button id="end-turn-button">پایان نوبت</button>
                <button id="new-game-button" style="margin-top: 10px;">بازی جدید</button> <!-- Added New Game button -->
                <div id="message-log-container">
                    <p>گزارش بازی:</p>
                    <ul id="message-log">
                        <!-- Messages will be added here by JavaScript -->
                    </ul>
                </div>
        </div>
    </main>
    <footer>
        <p>ساخته شده با ❤️</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
